<!DOCTYPE html><html><head><title>Israel Travel Guide</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/openlayers@6.14.1/dist/ol.css"/><style>body {font-family: Arial, sans-serif;} .attraction-card {margin-bottom: 20px; box-shadow: 0 0 10px rgba(0,0,0,0.1); padding: 20px; border-radius: 10px; width: 80%; margin: 0 auto;}.map-container {width: 80%; height: 400px; margin: 0 auto;}</style></head><body><h1 style="text-align: center;">Israel Travel Guide</h1><h2 style="text-align: center;">Explore the Holy Land</h2><div class="attraction-card"><h3>Western Wall, Jerusalem</h3><p>A historic landmark in Jerusalem's Old City.</p><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Jerusalem%20Western%20Wall%202017.jpg" style="width: 100%; height: 200px; object-fit: cover; border-radius: 10px;"></div><div class="attraction-card"><h3>Dead Sea</h3><p>A unique desert lake famous for floating and mineral-rich water.</p><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Dead%20Sea,%20Israel.jpg" style="width: 100%; height: 200px; object-fit: cover; border-radius: 10px;"></div><div class="attraction-card"><h3>Tel Aviv Beach</h3><p>A Mediterranean beach area with city life, food, and nightlife.</p><img src="https://commons.wikimedia.org/wiki/Special:FilePath/TelAviv%20beach%20from%20sky.jpg" style="width: 100%; height: 200px; object-fit: cover; border-radius: 10px;"></div><div class="map-container"><div id="map" style="width: 100%; height: 100%;"></div></div><script src="https://cdn.jsdelivr.net/npm/openlayers@6.14.1/dist/ol.js"></script><script>var map = new ol.Map({target: 'map',layers: [new ol.layer.Tile({source: new ol.source.OSM()})],view: new ol.View({center: ol.proj.fromLonLat([35.2345, 31.7767]),zoom: 8})});var marker1 = new ol.Feature({geometry: new ol.geom.Point(ol.proj.fromLonLat([35.2345, 31.7767]))});var marker2 = new ol.Feature({geometry: new ol.geom.Point(ol.proj.fromLonLat([35.4732, 31.5590]))});var marker3 = new ol.Feature({geometry: new ol.geom.Point(ol.proj.fromLonLat([34.7818, 32.0853]))});marker1.setStyle(new ol.style.Style({image: new ol.style.Icon({src: 'https://cdn-icons-png.flaticon.com/512/25/25694.png',scale: 0.1})}));marker2.setStyle(new ol.style.Style({image: new ol.style.Icon({src: 'https://cdn-icons-png.flaticon.com/512/25/25694.png',scale: 0.1})}));marker3.setStyle(new ol.style.Style({image: new ol.style.Icon({src: 'https://cdn-icons-png.flaticon.com/512/25/25694.png',scale: 0.1})}));map.addLayer(new ol.layer.Vector({source: new ol.source.Vector({features: [marker1, marker2, marker3]})}));</script></body></html>
