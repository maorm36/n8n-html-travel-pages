<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spain Travel Guide</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .hero {
            background-image: url('https://source.unsplash.com/1920x1080/?spain,travel');
            background-size: cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .card {
            margin: 20px;
            width: 300px;
        }
        .card img {
            height: 200px;
            object-fit: cover;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }
    </style>
</head>
<body>
    <section class="hero">
        <h1>Discover Spain</h1>
    </section>
    <div class="container">
        <h2>Top Attractions</h2>
        <div class="row">
            <div class="col-md-4">
                <div class="card">
                    <img src="https://source.unsplash.com/400x200/?sagrada-familia" alt="Sagrada Familia">
                    <div class="card-body">
                        <h5>Sagrada Familia</h5>
                        <p>Barcelona's iconic cathedral</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <img src="https://source.unsplash.com/400x200/?park-guell" alt="Park Guell">
                    <div class="card-body">
                        <h5>Park Guell</h5>
                        <p>Stunning public park in Barcelona</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <img src="https://source.unsplash.com/400x200/?alhambra" alt="Alhambra">
                    <div class="card-body">
                        <h5>Alhambra</h5>
                        <p>Historic palace in Granada</p>
                    </div>
                </div>
            </div>
        </div>
        <h2>Recommendations</h2>
        <p>Try the local cuisine, including tapas and paella. Visit the local markets and shops to experience the culture.</p>
        <h2>Map</h2>
        <iframe width="100%" height="400" frameborder="0" scrolling="no" marginheight="0" marginwidth="0" src="https://www.openstreetmap.org/export/embed.html?bbox=-18.16943359375%2C27.64183044426786%2C4.328125%2C43.809113554970016&amp;layer=mapnik&amp;marker=40.416775%2C-3.703787" style="border: 1px solid black"></iframe>
    </div>
</body>
</html>
